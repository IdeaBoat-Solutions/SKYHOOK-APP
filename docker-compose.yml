services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyhook
      POSTGRES_USER: skyhook_app
      POSTGRES_PASSWORD: skyhook_app
    ports:
      - "5432:5432"
    volumes:
      - skyhook_pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyhook_app -d skyhook"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: info
      DATABASE_URL: postgres://skyhook_app:skyhook_app@postgres:5432/skyhook
      JWT_ISSUER: http://localhost:3001
      JWT_AUDIENCE: skyhook-api
      JWT_DEV_SECRET: local-development-secret-change-me-please-32b
    ports:
      - "3001:3001"
    command: sh -c "npm run seed && npm run dev"

volumes:
  skyhook_pgdata:
